<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · TaskFlow</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body data-page="dashboard" data-title="Dashboard">
  <main id="page" class="page">
    <div class="page-head">
      <div>
        <h1 id="welcome">Welcome back</h1>
        <p>Here's what's happening across your projects.</p>
      </div>
      <div class="page-actions">
        <button type="button" class="btn" id="new-project"><i data-icon="folder"></i> New project</button>
        <button type="button" class="btn btn-primary" id="new-task"><i data-icon="plus"></i> New task</button>
      </div>
    </div>

    <div id="stats-area" aria-live="polite"></div>

    <div class="grid grid-dash section">
      <section class="card" aria-labelledby="h-status">
        <div class="card-title"><h2 id="h-status">Task status</h2></div>
        <div id="status-area"></div>
      </section>
      <section class="card" aria-labelledby="h-upcoming">
        <div class="card-title"><h2 id="h-upcoming">Upcoming deadlines</h2></div>
        <div id="upcoming-area"></div>
      </section>
    </div>

    <section class="card section" aria-labelledby="h-recent">
      <div class="card-title"><h2 id="h-recent">Recent tasks</h2><a class="btn btn-ghost btn-sm" href="my-tasks.html">View my tasks</a></div>
      <div id="recent-area"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
